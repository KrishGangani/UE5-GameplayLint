; GameplayLint UpdateBudget pack: which classes are budget clients and which actors must use the budget.
; The pack's defaults name UE5-UpdateBudget's classes; this project points the rules at its fixture classes (02 section 4.4).
; A config array replaces the constructor's list, so BudgetClientClasses here is only the fixture client.
[/Script/GameplayLintUpdateBudget.GameplayLintUpdateBudgetSettings]
+BudgetClientClasses=/Script/GameplayLint.GLFixtureBudgetClient
+BudgetScopeActorClasses=/Script/GameplayLint.GLFixtureAgent
