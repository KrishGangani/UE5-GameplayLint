; P10 GameplayLint - input classes.
; The Enhanced Input plugin is enabled by default; its local player subsystem needs the Enhanced player input class,
; or every game start logs "does not have a valid PlayerInput object" (EnhancedInputSubsystems.cpp). Epic's 5.8 templates set the same two lines.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
